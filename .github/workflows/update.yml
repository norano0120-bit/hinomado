name: 毎日更新して公開する

on:
  schedule:
    - cron: '0 21 * * *'   # UTC 21:00 = 日本時間 6:00
    - cron: '0 9 * * *'    # UTC 9:00  = 日本時間 18:00（天気と警報の更新用）
  workflow_dispatch:        # 手動実行もできるようにする
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: お知らせを取得する
        run: python scripts/fetch_news.py

      - name: 天気と警報を取得する
        run: python scripts/fetch_weather.py
        continue-on-error: true

      - name: 議会の情報を取得して要約する
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_gikai.py
        continue-on-error: true   # 議会が取れなくてもサイトは出す

      - name: サイトを組み立てる
        run: python scripts/build_site.py

      - name: 取得結果をリポジトリに残す
        run: |
          git config user.name 'hinomado-bot'
          git config user.email 'actions@github.com'
          git add data/news.json data/gikai.json data/weather.json
          git diff --staged --quiet || git commit -m "お知らせを更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
